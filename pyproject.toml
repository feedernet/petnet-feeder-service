[tool.poetry]
name = "feedernet"
version = "1.0.0"
description = "Breathing new life into your defunk PetNet feeders."
authors = [
    "Marc Billow <mbillow@users.noreply.github.com>",
    "Kenny Root <kruton@users.noreply.github.com>",
    "Ted Timmons <tedder@users.noreply.github.com>"
]
license = "MIT"
packages = [
    {include = "feeder"},
]
exclude = ["tests/**/*"]
readme = "README.md"
homepage = "http://feedernet.pet"
repository = "https://github.com/feedernet/petnet-feeder-service"
documentation = "https://github.com/feedernet/petnet-feeder-service/wiki"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop"
]

[tool.poetry.dependencies]
python = "^3.11"
alembic = "^1.8.1"
aiosqlite = "^0.21.0"
fastapi = "^0.122.0"
amqtt = { git = "https://github.com/feedernet/amqtt.git", rev = "e3cb4780d6274563c909df25158d57c1ecf772ca" }
pytz = "^2022.2"
semver = "^2.13.0"
sqlalchemy = {version = "^2.0", extras = ["asyncio"]}
greenlet = "^3.0"
uvicorn = "^0.18.3"
aiofiles = "^22.1.0"
Jinja2 = "^3.1.6"
cryptography = ">=44.0.1"
urllib3 = ">=2.6.0"
starlette = ">=0.47.2"
pydantic = "^2.0"
pydantic-settings = "^2.0"
python-json-logger = "^2.0"

[tool.poetry.dev-dependencies]
black = {version = "22.8.0", allow-prereleases = true}
pytest = "^8.4.2"
pytest-asyncio = "^0.18.1"
tox = "^4.30.3"
pytest-cov = "^3.0.0"
pytest-mock = "^3.15.1"
requests = "^2.32.4"
flake8 = "^7.3.0"
pylint = "^2.15.2"
pytest-xdist = "^2.5.0"
mypy = "^1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
disallow_untyped_defs = false
implicit_optional = true

[tool.poetry.plugins."amqtt.broker.plugins"]
auth_petnet = "feeder.util.mqtt.authentication:PetnetAuthPlugin"
topic_petnet = "feeder.util.mqtt.topic:PetnetTopicPlugin"
